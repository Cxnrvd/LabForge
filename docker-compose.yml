# One-command LabForge, all in Docker:
#
#   docker compose up --build        then open http://127.0.0.1:3000
#
# The API container has the Docker CLI and the host's Docker socket, so the Build button starts
# labs (Elasticsearch, Kibana, Windows guests ...) as sibling containers on your own engine.
# Everything is published on 127.0.0.1 only.
#
# Things to know:
#   * The Docker socket gives the API full control of your Docker engine. That is the point (it
#     builds labs), and it is why the API is only reachable from this computer and why it
#     requires LABFORGE_AGENT_TOKEN. Do not publish these ports on other interfaces.
#   * Windows guests need /dev/kvm in the Docker engine, which Docker Desktop with WSL2 provides.
#     Their first-boot script is injected by Compose, so it works from inside this container.
#   * The Vagrant/VirtualBox/VMware path needs your real hypervisor and cannot run in a container.
#     Use `pnpm dev` on the host for that. It is optional; Docker labs do not need it.
#   * Port checks and the disk figure on the Home page describe this container, not the host.
#     Published lab ports are still picked from Docker's own view of what is in use.
#
# Change the token before sharing the machine:  LABFORGE_AGENT_TOKEN=... docker compose up

name: labforge

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      LABFORGE_AGENT_TOKEN: ${LABFORGE_AGENT_TOKEN:-devtoken-change-me}
      LABFORGE_WORKSPACE_ROOT: /data/workspaces
      LABFORGE_DATABASE_URL: sqlite:////data/labforge.db
      LABFORGE_ALLOWED_HOSTS: '["api","localhost","127.0.0.1","::1"]'
      LABFORGE_API_PORT: "8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - labforge-data:/data
    ports:
      - "127.0.0.1:${LABFORGE_API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      LABFORGE_API_URL: http://api:8000
      LABFORGE_AGENT_TOKEN: ${LABFORGE_AGENT_TOKEN:-devtoken-change-me}
      LABFORGE_ALLOWED_HOSTS: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LABFORGE_WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  labforge-data:
