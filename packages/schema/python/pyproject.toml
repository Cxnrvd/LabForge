[project]
name = "labforge-schema"
version = "0.1.0"
description = "Shared Pydantic v2 topology schema for LabForge"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labforge_schema"]
