[alembic]
# LabForge migrations. Point ``sqlalchemy.url`` at the same DB the API uses;
# the env.py reads ``LABFORGE_DATABASE_URL`` if set so you only need to
# tweak this file when running migrations against a non-default URL.
script_location = alembic
sqlalchemy.url = sqlite:///./labforge.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
